[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm install --frozen-lockfile"
watchPatterns = [
  "/apps/wechat-ilink-worker/**",
  "/packages/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/tsconfig.base.json",
  "/railway.wechat.toml",
]

[deploy]
startCommand = "pnpm --filter @tomeet/wechat-ilink-worker start"
healthcheckPath = "/ready"
healthcheckTimeout = 120
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

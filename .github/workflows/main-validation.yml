name: Main Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: main-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: git fetch origin main
      - run: pnpm install --frozen-lockfile
      - name: Validate forward-only migrations
        run: pnpm agent:migrations:check -- --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Run repository checks
        run: pnpm check
